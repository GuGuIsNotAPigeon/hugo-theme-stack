mainSections   = ["post"]
rssFullContent = true
favicon        = "https://avatars.githubusercontent.com/u/212193102?v=4"
[dateFormat]
published = "2006-01-02"
[colorScheme]
default = "auto"
toggle = true
[article]
    headingAnchor = true
    math          = true
    toc           = true
    readingTime   = true
    [article.license]
        enabled = false
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
        [article.mermaid]
        # Visual style: classic or handDrawn (sketch style)
        look                  = "classic"
        # Theme for light mode: default, neutral, dark, forest, base, null
        lightTheme            = "default"
        # Theme for dark mode: default, neutral, dark, forest, base, null
        darkTheme             = "dark"
        securityLevel         = "strict"
        # Enable HTML labels in diagrams (requires securityLevel: loose)
        htmlLabels            = true
        transparentBackground = false

    [article.alertIcon]
        # Alert icons for different alert types (note, tip, important, warning, caution)
        note      = "📝"
        tip       = "💡"
        important = "📌"
        warning   = "⚠️"
        caution   = "🚨"

[autoOrient]
    enabled = true

[cookies]
    enabled = true

    [cookies.categories]
        analytics  = true
        functional = true
[comments]
    enabled  = true
    provider = "disqus"

    [comments.disqusjs]
        shortname  = ""
        apiUrl     = ""
        apiKey     = ""
        admin      = ""
        adminLabel = ""

    [comments.utterances]
        repo      = ""
        issueTerm = "pathname"
        label     = ""

    [comments.beaudar]
        repo      = ""
        issueTerm = "pathname"
        label     = ""
        theme     = ""

    [comments.remark42]
        host                    = ""
        site                    = ""
        locale                  = "en"
        max_shown_comments      = 15
        show_email_subscription = true

    [comments.vssue]
        platform        = ""
        owner           = ""
        repo            = ""
        clientId        = ""
        clientSecret    = ""
        autoCreateIssue = false

    # Waline client configuration see: https://waline.js.org/en/reference/component.html
    [comments.waline]
        serverURL    = ""
        lang         = ""
        pageview     = ""
        emoji        = ["https://unpkg.com/@waline/emojis@1.0.1/weibo"]
        requiredMeta = ["name", "email", "url"]

        [comments.waline.locale]
            admin       = "Admin"
            placeholder = ""

    [comments.twikoo]
        envId  = ""
        region = ""
        path   = ""
        lang   = ""

    # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
    [comments.cactus]
        defaultHomeserverUrl = "https://matrix.cactus.chat:8448"
        serverName           = "cactus.chat"
        siteName             = ""  # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

    [comments.giscus]
        repo             = ""
        repoID           = ""
        category         = ""
        categoryID       = ""
        mapping          = "title"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lang             = "en"
        strict           = 0
        loading          = "lazy"

    [comments.gitalk]
        owner        = ""
        admin        = ""
        repo         = ""
        clientID     = ""
        clientSecret = ""
        proxy        = ""

    [comments.cusdis]
        host = "https://cusdis.com"
        id   = ""

    # Comentario client configuration
    [comments.comentario]
        url                   = ""
        autoInit              = false
        autoNonInteractiveSso = false
        cssOverride           = ""
        lang                  = ""
        liveUpdate            = false
        maxLevel              = 0
        noFonts               = false
        theme                 = ""

[footer]
    since = 2026

[sidebar]
    compact   = false # 是否启用紧凑模式，默认为 false
    emoji    = "✨"
    subtitle = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    avatar   = "https://avatars.githubusercontent.com/u/212193102?v=4"

[thumbnail]
    enabled = true
[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 10 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [
        { type = "toc" },
        { type = "archives" },
    ]
